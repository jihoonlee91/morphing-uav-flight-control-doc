name: Build PDF

# Readers shouldn't need a Korean-capable TeX install to read the document:
# build main.tex and attach the PDF to the v1.0 release.
on:
  push:
    branches: [main]
    paths: ["main.tex", "resources/**", "packages/**", ".github/workflows/pdf.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
      - name: Attach to release v1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp main.pdf morphing-fcs-design.pdf
          gh release upload v1.0 morphing-fcs-design.pdf --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: morphing-fcs-design
          path: morphing-fcs-design.pdf
